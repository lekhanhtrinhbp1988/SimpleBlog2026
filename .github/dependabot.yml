version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for all minor and patch updates; major updates get their own PR.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      # Same rule as NuGet: minor and patch together, each major update in its own PR
      # so its breaking changes can be read and reverted on their own.
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
