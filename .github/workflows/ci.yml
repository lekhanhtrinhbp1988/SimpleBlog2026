name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      - name: Check formatting (.editorconfig)
        run: dotnet format --verify-no-changes --no-restore

      - run: dotnet build --no-restore --configuration Release

      - run: dotnet test --no-build --configuration Release

  # ADR-0007: feature documents need the approved project foundation.
  foundation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check project foundation
        env:
          # Empty on push to main, so the gate passes there.
          BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
        run: bash scripts/check-foundation.sh
