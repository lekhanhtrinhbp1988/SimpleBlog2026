name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN: every job here only reads the repository.
# A compromised action or package cannot push, release or change settings.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      - name: Check formatting (.editorconfig)
        run: dotnet format --verify-no-changes --no-restore

      - run: dotnet build --no-restore --configuration Release

      - name: Install Playwright browsers
        run: pwsh tests/SimpleBlog.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium firefox webkit

      - run: dotnet test --no-build --configuration Release

  # ADR-0007: feature documents need the approved project foundation.
  foundation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check project foundation
        env:
          # Empty on push to main, so the gate passes there.
          BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
        run: bash scripts/check-foundation.sh

  # ADR-0015: CSS of the site must follow the design token rules.
  stylelint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - run: npm install --no-audit --no-fund

      - name: Lint site CSS
        run: npx stylelint "src/SimpleBlog.Web/wwwroot/css/**/*.css"

      - name: Check the rules still catch violations
        run: bash scripts/check-stylelint-rules.sh
